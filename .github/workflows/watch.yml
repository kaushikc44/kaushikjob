name: Job Sniper

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay a few min under load)
  workflow_dispatch:          # manual trigger button

permissions:
  contents: write             # needed to commit seen_jobs.json back

concurrency:
  group: job-sniper
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watcher.py

      - name: Commit state
        run: |
          git config user.name "job-sniper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "update seen jobs [skip ci]"
          git push
